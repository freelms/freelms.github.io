name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild so prerendered course snapshots + sitemap stay fresh.
    - cron: '0 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # .env.production is committed (public Firebase web keys by design) so the
      # Pages build works with no secrets. FIREBASE_SERVICE_ACCOUNT (service
      # account JSON) unlocks full prerender data (lessons/syllabi); without it
      # the prerender falls back to public REST reads.
      # TODO(first-course): set ALLOW_ZERO_COURSES back to 'false' once a
      # course is published — a zero-course result then fails the build loudly.
      - run: npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALLOW_ZERO_COURSES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
